name: apx_task_management
description: "APX Task Management — Clean Architecture Flutter app (GetX + Dio + Dartz)."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management / DI / Navigation
  get: ^4.7.2

  # Networking
  dio: ^5.8.0+1
  internet_connection_checker: ^3.0.1

  # Functional error handling
  dartz: ^0.10.1

  # Local storage
  shared_preferences: ^2.5.3

  # Firebase
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.5
  flutter_local_notifications: ^19.2.1

  # UI
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1

  # Utilities
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  logger: ^2.5.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/appIcon/taskmanageApp.jpeg"

flutter:
  uses-material-design: true
